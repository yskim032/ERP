<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Phonebook | Firebase powered</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>Contact Manager</h1>
            <p>Secure & Cloud-driven storage</p>
        </header>

        <main>
            <!-- Save Section -->
            <section class="card glass">
                <h2><span class="icon">➕</span> Add New Contact</h2>
                <div class="input-group">
                    <input type="text" id="save-name" placeholder="Name" required>
                    <input type="tel" id="save-phone" placeholder="Phone Number" required>
                    <button id="btn-save" class="btn-primary">Save to Cloud</button>
                </div>
            </section>

            <!-- Search Section -->
            <section class="card glass">
                <h2><span class="icon">🔍</span> Quick Search</h2>
                <div class="input-group">
                    <input type="text" id="search-name" placeholder="Enter name to search...">
                    <button id="btn-search" class="btn-secondary">Lookup</button>
                </div>
                <div id="search-result" class="result-box hidden">
                    <p class="label">Result Found:</p>
                    <div class="result-content">
                        <span id="result-name" class="res-name"></span>
                        <span id="result-phone" class="res-phone"></span>
                    </div>
                </div>
            </section>
        </main>

        <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- App Logic -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
